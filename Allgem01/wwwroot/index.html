<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allgem</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
    <div id="app">Loading...</div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Počkat na inicializaci Blazoru a poté přesměrovat
        window.addEventListener('DOMContentLoaded', function () {
            // Zjistit, kdy je Blazor plně načtený
            var checkBlazorReady = setInterval(function () {
                if (window.Blazor && window.Blazor._internal) {
                    clearInterval(checkBlazorReady);
                    // Navigovat na Home.razor
                    setTimeout(function () {
                        window.location.href = '/';
                    }, 200);
                }
            }, 100);
        });
    </script>
</body>
</html>

@inject NavigationManager NavigationManager

<button class="btn btn-primary" @onclick="NavigateToHome">Go to Home</button>

@code {
    private void NavigateToHome()
    {
        NavigationManager.NavigateTo("/");
    }
}
